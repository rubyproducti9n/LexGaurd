<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LexGuard — AI-powered legal document intelligence. Understand contracts, identify risks, and prepare for legal consultations. Powered by Google Gemini.">
  <title>LexGuard — Legal Document Intelligence</title>

  <!-- Google Fonts & Material Symbols (Light 200 Weight) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" rel="stylesheet">

  <style>
    /* ==========================================================================
       Design System Variables (Ethereal Glass & OLED Palette)
       ========================================================================== */
    :root {
      --bg-primary:     #050508;   /* deeper OLED black */
      --bg-surface:     #0E0E14;   /* cards base */
      --bg-elevated:    #16161F;   /* elevated surfaces */
      --bg-glass:       rgba(255, 255, 255, 0.03); /* glass card fill */
      --accent-blue:    #5B8DEF;   /* refined, desaturated blue */
      --accent-blue-h:  #6B9DF7;
      --accent-green:   #27C492;
      --accent-amber:   #E8993A;
      --accent-red:     #E85D5D;
      --text-primary:   #EEEEF5;
      --text-secondary: #7878A0;
      --text-muted:     #3D3D55;
      --border:         rgba(255, 255, 255, 0.07); /* hairline */
      --border-strong:  rgba(255, 255, 255, 0.12);
      --glow-blue:      rgba(91, 141, 239, 0.15);
      --shadow-colored: 0 8px 32px rgba(91, 141, 239, 0.08);
      --shadow-surface: 0 20px 48px rgba(0, 0, 0, 0.5);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 24px;
      --radius-xl: 28px;

      --font-display: 'Instrument Serif', serif;
      --font-body: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --transition: 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* ==========================================================================
       CSS Reset, Noise Overlay & Base Styles
       ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* body never scrolls */
      margin: 0;
      background-color: var(--bg-primary);
      font-family: var(--font-body);
      color: var(--text-primary);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    #app {
      position: fixed;
      inset: 0;
      bottom: 48px; /* clears disclaimer bar height */
      overflow: hidden;
    }

    /* Fixed Micro-Noise Texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    ::selection {
      background: rgba(91, 141, 239, 0.25);
      color: var(--text-primary);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 100px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Headings */
    h1, h2, h3, h4 {
      text-wrap: balance;
      letter-spacing: -0.02em;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 3px;
      border-radius: 6px;
    }
    :focus:not(:focus-visible) {
      outline: none;
    }

    /* ==========================================================================
       All Screens Base Style & Transitions (Steps 2 & 3)
       ========================================================================== */
    [id^="screen-"] {
      position: absolute;
      inset: 0;
      display: none;        /* hidden by default */
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.32,0.72,0,1);
    }
    [id^="screen-"].screen-active {
      opacity: 1;
    }

    /* Results screen gets smooth internal scroll */
    #screen-results {
      display: none;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* Loading screen — no scroll needed */
    #screen-loading {
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @media (prefers-reduced-motion: reduce) {
      [id^="screen-"] { transition: none; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s cubic-bezier(0.32, 0.72, 0, 1),
                  transform 0.7s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .reveal {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }

    /* Accessibility Utilities */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ==========================================================================
       LexGuard Logo System
       ========================================================================== */
    .header-logo {
      display: inline-flex;
      align-items: baseline;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      line-height: 1;
      user-select: none;
    }
    .logo-lex {
      font-family: var(--font-display);
      font-style: italic;
      color: var(--accent-blue);
      font-weight: 400;
      font-size: 1.55rem;
    }
    .logo-guard {
      font-family: var(--font-display);
      color: var(--text-primary);
      font-weight: 400;
      font-size: 1.55rem;
    }

    /* ==========================================================================
       Form & Interactive Controls (Button-in-Button & Inputs)
       ========================================================================== */
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-input, .key-input {
      background: var(--bg-primary);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.9rem;
      width: 100%;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s cubic-bezier(0.32, 0.72, 0, 1),
                  box-shadow 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .form-input:focus, .key-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.15), inset 0 1px 2px rgba(0, 0, 0, 0.4);
      outline: none;
    }

    .form-error {
      color: var(--accent-red);
      font-size: 0.82rem;
      margin-top: 8px;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Button-in-Button Primary Pattern */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--accent-blue);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 10px 10px 20px;
      color: #FFFFFF;
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(91, 141, 239, 0.25);
      transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1),
                  background 0.2s cubic-bezier(0.32, 0.72, 0, 1),
                  box-shadow 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .btn-primary:hover {
      background: var(--accent-blue-h);
      box-shadow: 0 6px 28px rgba(91, 141, 239, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.985);
    }
    .btn-primary .btn-icon-wrap {
      width: 34px;
      height: 34px;
      background: rgba(0, 0, 0, 0.22);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .btn-primary:hover .btn-icon-wrap {
      transform: translateX(2px);
    }
    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Secondary / Ghost Buttons */
    .btn-text-secondary, .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .btn-text-secondary:hover, .btn-ghost:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-strong);
    }

    /* ==========================================================================
       API Key Settings Panel CSS (Step 3)
       ========================================================================== */
    /* Settings trigger button */
    #btn-settings {
      position: relative;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.32,0.72,0,1);
    }
    #btn-settings:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    #btn-settings.has-key {
      border-color: rgba(39,196,146,0.3);
      color: var(--accent-green);
    }

    /* Status dot on settings button */
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      position: absolute;
      top: 6px; right: 6px;
    }
    .status-dot--empty  { background: var(--accent-amber); }
    .status-dot--saved  { background: var(--accent-green); }

    /* Settings panel */
    #settings-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-top: none;
      border-radius: 0 0 16px 16px;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s cubic-bezier(0.32,0.72,0,1),
                  opacity 0.25s cubic-bezier(0.32,0.72,0,1);
      opacity: 0;
      max-width: 500px;
      margin: -20px auto 28px;
      width: 100%;
    }
    #settings-panel:not([hidden]) {
      max-height: 200px;
      opacity: 1;
    }
    .settings-panel-inner {
      padding: 16px 20px 20px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .settings-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .settings-label .material-symbols-outlined {
      font-size: 16px;
    }
    .settings-link {
      font-size: 0.75rem;
      color: var(--accent-blue);
      text-decoration: none;
    }
    .settings-link:hover { text-decoration: underline; }

    /* Input row */
    .settings-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .settings-input-row input {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-family: var(--font-body);
      transition: border-color 0.2s cubic-bezier(0.32,0.72,0,1),
                  box-shadow 0.2s cubic-bezier(0.32,0.72,0,1);
    }
    .settings-input-row input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--glow-blue);
    }
    #btn-key-toggle {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.32,0.72,0,1);
    }
    #btn-key-toggle:hover { color: var(--text-primary); }
    #btn-key-save {
      background: var(--accent-blue);
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.32,0.72,0,1);
    }
    #btn-key-save:hover { background: #6B9DF7; }
    #btn-key-save:active { transform: scale(0.97); }

    /* Error + saved messages */
    .settings-error {
      font-size: 0.78rem;
      color: var(--accent-red);
      margin-top: 8px;
    }
    .settings-saved {
      font-size: 0.78rem;
      color: var(--accent-green);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .settings-saved .material-symbols-outlined { font-size: 14px; }

    /* ==========================================================================
       SCREEN 2: Document Input (#screen-input)
       ========================================================================== */
    #screen-input {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 20px 60px;
      width: 100%;
    }

    /* Floating Glass Pill Header Nav */
    #input-header, .input-header {
      position: sticky;
      top: 16px;
      margin: 16px auto 32px;
      max-width: fit-content;
      background: rgba(14, 14, 20, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* Mode Toggle refined pills */
    .mode-toggle-container {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .mode-toggle-pills {
      display: inline-flex;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px;
      gap: 2px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    .mode-pill {
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 0.84rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .mode-pill.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--border);
    }
    .mode-pill:hover:not(.active) {
      color: var(--text-primary);
    }

    /* Document Input Panes & Double-Bezel Textareas */
    .docs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }
    .docs-grid.compare-mode {
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 768px) {
      .docs-grid.compare-mode {
        grid-template-columns: 1fr;
      }
    }

    .doc-pane {
      display: flex;
      flex-direction: column;
    }
    .doc-input-outer {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px;
      transition: border-color 0.2s cubic-bezier(0.32, 0.72, 0, 1),
                  box-shadow 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .doc-input-outer:focus-within {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 3px var(--glow-blue);
    }
    .doc-textarea, .form-textarea {
      background: var(--bg-surface);
      border: none;
      border-radius: 16px;
      padding: 20px 22px;
      width: 100%;
      min-height: 280px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.9rem;
      line-height: 1.65;
      resize: vertical;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
      outline: none;
    }
    .doc-textarea::placeholder, .form-textarea::placeholder {
      color: var(--text-muted);
    }

    /* Error Notification Banner */
    .error-banner {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 90%;
      width: 500px;
      background: rgba(22, 22, 31, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-strong);
      border-left: 3px solid var(--accent-red);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      color: var(--text-primary);
      font-size: 0.88rem;
    }
    .error-banner[hidden] {
      display: none !important;
    }
    .btn-dismiss-banner {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .btn-dismiss-banner:hover {
      color: var(--text-primary);
    }

    /* ==========================================================================
       SCREEN 3: Loading Screen (#screen-loading)
       ========================================================================== */
    #screen-loading {
      padding: 24px;
      text-align: center;
      position: relative;
    }
    #screen-loading::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--glow-blue) 0%, transparent 70%);
      pointer-events: none;
    }

    .pulse-ring-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }
    .loading-orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%,
        rgba(91, 141, 239, 0.3) 0%,
        rgba(91, 141, 239, 0.05) 60%,
        transparent 100%);
      border: 1px solid rgba(91, 141, 239, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: orb-breathe 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      box-shadow: 0 0 40px rgba(91, 141, 239, 0.15),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }
    @keyframes orb-breathe {
      0%, 100% { transform: scale(1);    opacity: 0.85; }
      50%       { transform: scale(1.08); opacity: 1;    }
    }
    #loading-status {
      font-size: 0.9rem;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
      min-height: 28px;
      position: relative;
      z-index: 1;
    }

    /* ==========================================================================
       SCREEN 4: Results Screen (#screen-results)
       ========================================================================== */
    #screen-results {
      width: 100%;
    }

    /* Results Sticky Pill Header */
    #results-header {
      position: sticky;
      top: 16px;
      margin: 16px auto 28px;
      max-width: fit-content;
      background: rgba(14, 14, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      padding: 8px 12px 8px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .results-header-inner {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .results-meta-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-doc-type {
      background: rgba(255, 255, 255, 0.04);
      color: var(--accent-blue);
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid rgba(91, 141, 239, 0.25);
    }

    .badge-complexity {
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-complexity.low {
      color: var(--accent-green);
      background: rgba(39, 196, 146, 0.12);
      border: 1px solid rgba(39, 196, 146, 0.25);
    }
    .badge-complexity.medium {
      color: var(--accent-amber);
      background: rgba(232, 153, 58, 0.12);
      border: 1px solid rgba(232, 153, 58, 0.25);
    }
    .badge-complexity.high {
      color: var(--accent-red);
      background: rgba(232, 93, 93, 0.12);
      border: 1px solid rgba(232, 93, 93, 0.25);
    }

    .results-content-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* Document Summary Strip */
    .results-summary-strip {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 24px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      max-width: 900px;
      margin: 0 auto 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .results-summary-strip .summary-icon {
      color: var(--accent-blue);
      font-size: 22px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    .results-summary-text {
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    /* Visuals Grid & Universal Double-Bezel Cards */
    .visuals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto 32px;
    }
    @media (max-width: 768px) {
      .visuals-grid {
        grid-template-columns: 1fr;
      }
    }

    .visual-slot {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Double-Bezel Card Archetype for all dynamic cards */
    .visual-card, .red-flags-card, .lp-panel-card, .consult-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 5px;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .visual-card-header, .red-flags-header, .lp-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .visual-card-title, .red-flags-title, .lp-title {
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Source Attribution Details Accordion */
    .source-detail {
      margin-top: 10px;
      border-left: 2px solid var(--accent-blue);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }
    .source-detail summary {
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.78rem;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      list-style: none;
      transition: color 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .source-detail summary::-webkit-details-marker { display: none; }
    .source-detail summary::before {
      content: '▸';
      font-size: 0.7rem;
      transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .source-detail[open] summary::before {
      transform: rotate(90deg);
    }
    .source-detail blockquote {
      margin: 0;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.55;
      border-top: 1px solid var(--border);
    }

    /* Severity Badges (Text + Icon + Color) */
    .severity-pill {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 100px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      line-height: 1;
    }
    .severity-pill.high, .severity-high {
      background: rgba(232, 93, 93, 0.12);
      color: var(--accent-red);
      border: 1px solid rgba(232, 93, 93, 0.25);
    }
    .severity-pill.medium, .severity-medium {
      background: rgba(232, 153, 58, 0.12);
      color: var(--accent-amber);
      border: 1px solid rgba(232, 153, 58, 0.25);
    }
    .severity-pill.low, .severity-low {
      background: rgba(39, 196, 146, 0.12);
      color: var(--accent-green);
      border: 1px solid rgba(39, 196, 146, 0.25);
    }

    /* Progress Tracks & Bars */
    .progress-track, .risk-progress-track {
      height: 5px;
      background: var(--bg-elevated);
      border-radius: 100px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill, .risk-progress-bar {
      height: 100%;
      border-radius: 100px;
      transition: width 0.8s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* ==========================================================================
       VISUAL 1: Risk Assessment Meter
       ========================================================================== */
    .risk-meter-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .risk-arc-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    .risk-level-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .risk-breakdown-heading {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-align: center;
    }
    .risk-categories-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .risk-category-row {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
    }
    .risk-category-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .risk-category-name {
      color: var(--text-primary);
      font-weight: 500;
    }
    .risk-category-score {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
    }
    .risk-category-note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* ==========================================================================
       VISUAL 2: Clause Map
       ========================================================================== */
    .clause-map-list {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 540px;
      overflow-y: auto;
    }
    .clause-card-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .clause-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .clause-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .clause-badge {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 100px;
      letter-spacing: 0.04em;
    }
    .clause-body-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* ==========================================================================
       VISUAL 3: Obligation Timeline
       ========================================================================== */
    .timeline-container {
      padding: 20px;
      max-height: 540px;
      overflow-y: auto;
    }
    .timeline-track {
      position: relative;
      padding-left: 28px;
      list-style: none;
    }
    .timeline-track::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border);
    }
    .timeline-node {
      position: relative;
      margin-bottom: 24px;
    }
    .timeline-node:last-child {
      margin-bottom: 0;
    }
    .timeline-node::before {
      content: '';
      position: absolute;
      left: -25px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--node-color, var(--accent-blue));
      background: var(--bg-primary);
      box-shadow: 0 0 10px var(--node-color, var(--accent-blue));
    }
    .timeline-deadline {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .timeline-node-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .timeline-node-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .timeline-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .timeline-desc {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ==========================================================================
       VISUAL 4: Clause Battle
       ========================================================================== */
    .battle-container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .battle-scores-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .battle-score-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .battle-score-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .battle-score-val {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .battle-score-tag {
      font-size: 0.75rem;
      font-weight: 600;
    }

    .battle-table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .battle-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
    }
    .battle-table th {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .battle-table td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-primary);
    }
    .battle-table tr:last-child td {
      border-bottom: none;
    }
    .battle-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .battle-source-muted {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .battle-winner-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.04);
    }
    .battle-verdict-strip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-green);
      border-radius: var(--radius-md);
      padding: 16px 20px;
    }
    .battle-verdict-strip.tie {
      border-left-color: var(--accent-amber);
    }
    .battle-verdict-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .battle-verdict-note {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       Red Flags Strip
       ========================================================================== */
    .red-flags-strip {
      max-width: 1100px;
      margin: 0 auto 32px;
    }
    .red-flags-list {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .red-flag-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
    }
    .red-flag-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .red-flag-title-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .red-flag-desc {
      font-size: 0.86rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* ==========================================================================
       Lawyer Prep CTA Strip & Consult Card
       ========================================================================== */
    .lawyer-prep-cta {
      max-width: 1100px;
      margin: 0 auto;
    }
    .lawyer-cta-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    @media (max-width: 768px) {
      .lawyer-cta-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
      }
      .lawyer-cta-btn {
        width: 100% !important;
      }
    }
    .lawyer-cta-content {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .lawyer-cta-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(91,141,239,0.2) 0%, rgba(91,141,239,0.05) 100%);
      border: 1px solid rgba(91, 141, 239, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .lawyer-cta-heading {
      font-family: var(--font-display);
      font-size: 1.45rem;
      color: var(--text-primary);
      font-weight: 400;
      margin-bottom: 4px;
    }
    .lawyer-cta-text {
      color: var(--text-secondary);
      font-size: 0.88rem;
      line-height: 1.5;
      max-width: 600px;
    }
    .lawyer-cta-btn {
      width: auto !important;
      white-space: nowrap;
      padding: 12px 24px;
      flex-shrink: 0;
    }

    /* Consult Card */
    .consult-card {
      border-top: 3px solid var(--accent-amber);
      padding: 40px 32px;
      text-align: center;
      max-width: 680px;
      margin: 40px auto;
      grid-column: 1 / -1;
    }
    .consult-icon {
      font-size: 2.8rem;
      margin-bottom: 16px;
    }
    .consult-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .consult-reason {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
      font-size: 0.92rem;
    }
    .consult-findings {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      text-align: left;
      margin-bottom: 28px;
    }
    .consult-findings-title {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .consult-findings li {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 6px;
      list-style: none;
      padding-left: 4px;
    }
    .consult-findings li::before {
      content: '•';
      color: var(--accent-amber);
      margin-right: 8px;
    }
    .consult-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 16px;
      font-style: italic;
    }

    /* Lawyer Prep Panel */
    .lawyer-prep-panel {
      max-width: 1100px;
      margin: 28px auto 0;
    }
    .lp-panel-card {
      padding: 32px 36px;
    }
    @media (max-width: 768px) {
      .lp-panel-card {
        padding: 20px 16px;
      }
    }
    .lp-section-header {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 28px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .lp-summary-text {
      color: var(--text-primary);
      font-size: 0.92rem;
      line-height: 1.7;
    }
    .lp-red-flags-list, .lp-questions-list, .lp-negotiations-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .lp-red-flag-item, .lp-negotiation-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .lp-red-flag-header, .lp-negotiation-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.92rem;
      margin-bottom: 4px;
    }
    .lp-ask-lawyer {
      font-style: italic;
      color: var(--accent-blue);
      font-size: 0.86rem;
      line-height: 1.5;
    }
    .lp-question {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      cursor: pointer;
      transition: background-color 0.2s cubic-bezier(0.32, 0.72, 0, 1),
                  border-color 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .lp-question:hover {
      background: rgba(91, 141, 239, 0.05);
      border-color: rgba(91, 141, 239, 0.25);
    }
    .lp-question input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--text-muted);
      border-radius: 4px;
      background: var(--bg-primary);
      cursor: pointer;
      display: grid;
      place-content: center;
      margin-top: 2px;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .lp-question input[type="checkbox"]:checked {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }
    .lp-question input[type="checkbox"]:checked::after {
      content: '✓';
      color: #fff;
      font-size: 11px;
      font-weight: bold;
    }
    .lp-question span {
      font-size: 0.88rem;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .lp-negotiation-clause {
      font-size: 0.75rem;
      font-weight: normal;
      color: var(--text-muted);
      margin-left: 4px;
    }
    .lp-negotiation-desc {
      color: var(--text-secondary);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .lp-jurisdiction-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--text-secondary);
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lp-disclaimer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 14px;
      text-align: center;
    }

    .btn-spinner-inline {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .empty-state .material-symbols-outlined {
      font-size: 32px;
      color: var(--accent-blue);
    }

    /* ==========================================================================
       Fixed Bottom Disclaimer Bar (Always Visible - Step 4)
       ========================================================================== */
    #disclaimer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 200; /* always above all screens */
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      background: rgba(14, 14, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: left;
    }
    #disclaimer-bar .material-symbols-outlined {
      font-size: 18px;
      color: var(--accent-blue);
      flex-shrink: 0;
    }
    .disclaimer-powered {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .google-g {
      color: var(--accent-blue);
      font-weight: 700;
    }

    /* ==========================================================================
       Print Styles
       ========================================================================== */
    @media print {
      #screen-apikey,
      #screen-input,
      #screen-loading,
      #results-header,
      #visuals-grid,
      #red-flags-strip,
      #lawyer-prep-cta,
      #lawyer-prep-cta button,
      #disclaimer-bar,
      .btn-ghost,
      .lp-header button,
      body::before {
        display: none !important;
      }

      body {
        background: #fff !important;
        color: #000 !important;
        padding-bottom: 0 !important;
      }

      #screen-results,
      .results-content-container {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      #lawyer-prep-panel,
      .lawyer-prep-panel {
        display: block !important;

<body>

  <!-- Main Application Container -->
  <main role="main">
    <div id="app">
      <!-- Screen 2: Document Input Screen -->
      <div id="screen-input">
        <!-- Error Banner -->
        <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1" hidden>

        <!-- Floating Glass Header Bar -->

          <!-- Settings trigger button — add to input screen header -->

            <span class="material-symbols-outlined" aria-hidden="true">settings</span>

        <!-- Inline settings panel — add directly below header bar -->

        <!-- Mode Toggle -->

        <!-- Document Input Form (Double-Bezel Textareas) -->

          <div class="docs-grid" id="docs-grid">

              <div class="doc-input-outer">

                  aria-describedby="doc-a-error"

      <!-- Screen 3: Loading Screen (Ethereal Orb) -->
      <div id="screen-loading">

      <!-- Screen 4: Results Screen -->
      <div id="screen-results">
        <!-- Floating Glass Top Bar -->
        <header id="results-header">
          <div class="results-header-inner">
            <!-- Left: LexGuard logo -->

              <span class="logo-lex">Lex</span><span class="logo-guard">Guard</span>
            </div>

            <div class="results-meta-badges">
              <span id="badge-doc-type" class="badge-doc-type"></span>

        <!-- Main Results Container -->

          <div id="lawyer-prep-cta" class="lawyer-prep-cta reveal"></div>
