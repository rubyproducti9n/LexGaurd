  </main>

  <!-- Always-Visible Disclaimer Bar -->
  <footer id="disclaimer-bar" role="contentinfo">
    <span class="material-symbols-outlined" aria-hidden="true">balance</span>
    <span>
      <strong>LexGuard</strong> provides legal information only — not legal advice. Always consult a qualified lawyer before making legal decisions.
    </span>
    <span class="disclaimer-powered">
      Powered by <span class="google-g" aria-label="Google">G</span>oogle Gemini
    </span>
  </footer>

  <!-- Screen Switching & Interaction Logic (Functionality Unchanged) -->
  <script>
    // ── App readiness flag ────────────────────────────────
    let appReady = false;

    /**
     * Initializes app — pings server and loads Firebase config.
     * No secrets ever stored in frontend variables.
     */
    async function initApp() {
      try {
        // Step 1 — confirm server is running
        const pingRes = await fetch('/api/ping');
        if (!pingRes.ok) throw new Error('Server unreachable');
        const ping = await pingRes.json();
        if (!ping.ok) throw new Error('Server not ready');

        // Step 2 — fetch Firebase config from server
        const configRes = await fetch('/api/config');
        if (!configRes.ok) throw new Error('Config unavailable');
        const firebaseConfig = await configRes.json();

        // Step 3 — initialize Firebase with fetched config
        if (typeof window.initFirebase === 'function') {
          await window.initFirebase(firebaseConfig);
        }

        appReady = true;

      } catch (e) {
        console.error('Init failed:', e.message);
        showStartupError();
      }
    }

    /**
     * Shows a non-dismissable startup error when server is unreachable.
     * Never mentions API key to the user — purely a dev/ops message.
     */
    function showStartupError() {
      // Replace entire app content with clear error state
      document.getElementById('app').innerHTML = `
        <div style="
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: var(--font-body);
          background: var(--bg-primary);
          padding: 24px;
        ">
          <div style="
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-top: 3px solid var(--accent-red);
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 420px;
            text-align: center;
          ">
            <span class="material-symbols-outlined"
                  style="font-size:2.5rem;color:var(--accent-red)"
                  aria-hidden="true">wifi_off</span>
            <h2 style="
              font-family: var(--font-display);
              color: var(--text-primary);
              margin: 16px 0 10px;
              font-size: 1.4rem;
            ">LexGuard is not reachable</h2>
            <p style="
              color: var(--text-secondary);
              font-size: 0.875rem;
              line-height: 1.6;
              margin: 0 0 24px;
            ">
              The application server is not running.<br>
              Please start it and refresh this page.
            </p>
            <div style="
              background: var(--bg-elevated);
              border-radius: 10px;
              padding: 14px 16px;
              text-align: left;
              font-size: 0.8rem;
              color: var(--text-secondary);
              font-family: monospace;
              line-height: 1.8;
            ">
              $ npm start<br>
              $ open http://localhost:3000
            </div>
            <button onclick="location.reload()" style="
              margin-top: 20px;
              background: var(--accent-blue);
              border: none;
              border-radius: 10px;
              padding: 12px 24px;
              color: #fff;
              font-family: var(--font-body);
              font-size: 0.875rem;
              font-weight: 500;
              cursor: pointer;
              width: 100%;
            ">
              Retry
            </button>
          </div>
        </div>
      `;
    }

    // ==========================================================================
    // PART 1: Global Error Handlers
    // ==========================================================================
    window.addEventListener('unhandledrejection', (e) => {
      e.preventDefault();
      // Never surface raw error to user
      showErrorBanner('Something went wrong. Please try again.');
    });

    window.addEventListener('error', (e) => {
      e.preventDefault();
      // Silent — no raw JS errors exposed to user
    });

    // ==========================================================================
    // Safe Storage Wrapper with in-memory fallback for local file:// execution
    // ==========================================================================
    const safeStorage = {
      _data: {},
      getItem(key) {
        try {
          if (window.sessionStorage) {
            const val = window.sessionStorage.getItem(key);
            if (val !== null && val !== undefined) return val;
          }
        } catch (e) {}
        return this._data[key] !== undefined ? this._data[key] : null;
      },
      setItem(key, val) {
        try {
          if (window.sessionStorage) {
            window.sessionStorage.setItem(key, val);
          }
        } catch (e) {}
        this._data[key] = String(val);
      },
      removeItem(key) {
        try {
          if (window.sessionStorage) {
            window.sessionStorage.removeItem(key);
          }
        } catch (e) {}
        delete this._data[key];
      },
      clear() {
        try {
          if (window.sessionStorage) {
            window.sessionStorage.clear();
          }
        } catch (e) {}
        this._data = {};
      }
    };

    // ==========================================================================
    // Tab Close Cleanup
    // ==========================================================================
    window.addEventListener('beforeunload', () => {
      safeStorage.removeItem('lgKey');
      safeStorage.removeItem('lgDocA');
      safeStorage.removeItem('lgDocB');
    });

    // ==========================================================================
    // Error Banner & Status Helpers
    // ==========================================================================
    let errorBannerTimeout = null;

    /** Displays accessible error notification banner. */
    function showErrorBanner(message) {
      const banner = document.getElementById('error-banner');
      const msg = document.getElementById('error-banner-text');
      if (!banner || !msg) return;

      msg.textContent = message; // textContent — never innerHTML
      banner.hidden = false;
      banner.focus(); // move focus for screen readers

      if (errorBannerTimeout) clearTimeout(errorBannerTimeout);
      errorBannerTimeout = setTimeout(() => {
        banner.hidden = true;
      }, 6000);
    }

    document.getElementById('btn-dismiss-banner')?.addEventListener('click', () => {
      const banner = document.getElementById('error-banner');
      if (banner) banner.hidden = true;
      if (errorBannerTimeout) clearTimeout(errorBannerTimeout);
    });

    /** Asserts browser is online before initiating API calls. */
    function assertOnline() {
      if (!navigator.onLine) {
        showErrorBanner('No internet connection. Please check your network.');
        throw new Error('offline');
      }
    }

    /** Maps HTTP status codes to user-friendly error messages. */
    function geminiErrorMessage(status) {
      const map = {
        400: 'Invalid request. Please check your document and try again.',
        401: 'API key rejected. Please re-enter a valid Gemini API key.',
        403: 'API key does not have permission. Check your Google AI Studio settings.',
        429: 'Usage limit reached. Try again tomorrow or use a different API key.',
        500: 'Gemini service error. Please try again in a moment.',
        503: 'Gemini is temporarily unavailable. Please try again shortly.',
      };
      return map[status] || 'Unexpected error. Please try again.';
    }

    /** Cleans dynamic analysis state when returning to input screen for retry. */
    function resetForRetry() {
      safeStorage.removeItem('lgClassification');
      safeStorage.removeItem('lgAnalysis');
      safeStorage.removeItem('lgVisuals');
      const s1 = document.getElementById('visual-slot-1');
      const s2 = document.getElementById('visual-slot-2');
      const flags = document.getElementById('red-flags-strip');
      const cta = document.getElementById('lawyer-prep-cta');
      const panel = document.getElementById('lawyer-prep-panel');
      if (s1) s1.innerHTML = '';
      if (s2) s2.innerHTML = '';
      if (flags) {
        flags.innerHTML = '';
        flags.hidden = true;
      }
      if (cta) cta.innerHTML = '';
      if (panel) {
        panel.innerHTML = '';
        panel.hidden = true;
      }
    }

    /** Switches visible screen and manages focus for accessibility (Step 6). */
    function showScreen(id) {
      if (id === 'screen-input') {
        resetForRetry();
      }

      // Hide all screens
      document.querySelectorAll('[id^="screen-"]').forEach(s => {
        s.classList.remove('screen-active');
        s.setAttribute('aria-hidden', 'true');
        // Wait for fade out then hide
        setTimeout(() => {
          if (!s.classList.contains('screen-active')) {
            s.style.display = 'none';
          }
        }, 300);
      });

      // Show target
      const target = document.getElementById(id);
      if (!target) return;

      // Set correct display type per screen
      const displayType = (id === 'screen-loading') ? 'flex' : 'block';
      target.style.display = displayType;
      target.removeAttribute('aria-hidden');
      target.scrollTop = 0;

      // Trigger fade in on next frame
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          target.classList.add('screen-active');
        });
      });

      // Focus management
      setTimeout(() => {
        const focusTarget = target.querySelector(
          'h1, h2, [role="heading"], input, button, [tabindex="0"]'
        );
        if (focusTarget) {
          focusTarget.setAttribute('tabindex', '-1');
          focusTarget.focus({ preventScroll: true });
        }
      }, 320);
    }

    // ==========================================================================
    // IntersectionObserver Scroll Reveal Logic
    // ==========================================================================
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    function observeRevealTargets() {
      document.querySelectorAll('.reveal').forEach((el, index) => {
        if (!el.classList.contains('revealed')) {
          el.style.transitionDelay = (index * 60) + 'ms';
          revealObserver.observe(el);
        }
      });
    }

    function addRevealClasses() {
      document.querySelectorAll('.visual-card, .timeline-node, .red-flag-item, .battle-table tr, .lp-red-flag-item, .lp-question, .lp-negotiation-item, .consult-card, .lawyer-cta-card, .results-summary-strip').forEach(el => {
        if (!el.classList.contains('reveal')) {
          el.classList.add('reveal');
        }
      });
      observeRevealTargets();
    }

    // ==========================================================================
    // Loading Status Message Cycler
    // ==========================================================================
    let loadingInterval = null;

    function startLoadingCycle() {
      const messages = [
        'Reading your document...',
        'Identifying document type...',
        'Running legal analysis...',
        'Preparing your results...',
      ];
      let i = 0;
      const el = document.getElementById('loading-status');
      if (!el) return;
      el.textContent = messages[0];
      if (loadingInterval) clearInterval(loadingInterval);
      loadingInterval = setInterval(() => {
        i = (i + 1) % messages.length;
        el.textContent = messages[i];
      }, 3000);
    }

    function stopLoadingCycle() {
      if (loadingInterval) {
        clearInterval(loadingInterval);
        loadingInterval = null;
      }
    }

    // ==========================================================================
    // Helpers: Document Sanitization, HTML Escaping, Empty Guard
    // ==========================================================================
    /** Sanitizes document input text before storing or sending to prompt. */
    function sanitizeDoc(text) {
      return String(text)
        .replace(/[<>]/g, '')   // strip angle brackets
        .trim()
        .slice(0, 60000);        // hard cap
    }

    /** Sanitizes all user-facing strings from API responses. */
    function safe(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /** Guards against empty arrays/data before rendering a visual component. */
    function guardEmpty(data, fieldName, visualName) {
      if (!data || !data[fieldName] || data[fieldName].length === 0) {
        return `<div class="empty-state">
          <span class="material-symbols-outlined" aria-hidden="true">info</span>
          <p>No ${visualName} data found in this document.</p>
        </div>`;
      }
      return null;
    }

    function getNextVisualSlot() {
      const s1 = document.getElementById('visual-slot-1');
      const s2 = document.getElementById('visual-slot-2');
      if (s1 && (!s1.hasChildNodes() || s1.innerHTML.trim() === '')) return s1;
      return s2;
    }

    // ==========================================================================
    // SCREEN 2: Document Input Logic
    // ==========================================================================
    let currentMode = 'single'; // 'single' | 'compare'

    const modeSingleBtn = document.getElementById('mode-single');
    const modeCompareBtn = document.getElementById('mode-compare');
    const docsGrid = document.getElementById('docs-grid');
    const paneDocB = document.getElementById('pane-doc-b');
    const labelDocA = document.getElementById('label-doc-a');
    const docAInput = document.getElementById('doc-a');
    const docBInput = document.getElementById('doc-b');
    const docAError = document.getElementById('doc-a-error');
    const docBError = document.getElementById('doc-b-error');
    const btnAnalyze = document.getElementById('btn-analyze');

    // Mode Switching
    function setMode(mode) {
      currentMode = mode;
      if (docAError) docAError.textContent = '';
      if (docBError) docBError.textContent = '';

      if (mode === 'single') {
        if (modeSingleBtn) {
          modeSingleBtn.classList.add('active');
          modeSingleBtn.setAttribute('aria-checked', 'true');
        }
        if (modeCompareBtn) {
          modeCompareBtn.classList.remove('active');
          modeCompareBtn.setAttribute('aria-checked', 'false');
        }

        if (docsGrid) docsGrid.classList.remove('compare-mode');
        if (paneDocB) paneDocB.hidden = true;
        if (labelDocA) labelDocA.textContent = 'Paste your legal document';
      } else {
        if (modeCompareBtn) {
          modeCompareBtn.classList.add('active');
          modeCompareBtn.setAttribute('aria-checked', 'true');
        }
        if (modeSingleBtn) {
          modeSingleBtn.classList.remove('active');
          modeSingleBtn.setAttribute('aria-checked', 'false');
        }

        if (docsGrid) docsGrid.classList.add('compare-mode');
        if (paneDocB) paneDocB.hidden = false;
        if (labelDocA) labelDocA.textContent = 'Document A';
        window._lg?.recordEvent('compare_mode_used');
      }
    }

    if (modeSingleBtn) modeSingleBtn.addEventListener('click', () => setMode('single'));
    if (modeCompareBtn) modeCompareBtn.addEventListener('click', () => setMode('compare'));

    // Listen for <details class="source-detail"> toggle
    document.addEventListener('toggle', (e) => {
      if (e.target.classList && e.target.classList.contains('source-detail') && e.target.open) {
        window._lg?.recordEvent('source_expanded');
      }
    }, true);

    // Clear Errors on input / keydown
    if (docAInput && docAError) docAInput.addEventListener('keydown', () => { docAError.textContent = ''; });
    if (docBInput && docBError) docBInput.addEventListener('keydown', () => { docBError.textContent = ''; });

    // Handle Document Validation & Analysis
    function handleAnalyzeSubmit() {
      if (!appReady) {
        showErrorBanner('Server not reachable. Please refresh.');
        return;
      }

      let hasError = false;

      // Validate Document A
      const valA = (docAInput ? docAInput.value : '').trim();
      if (!valA) {
        if (docAError) docAError.textContent = 'Please paste a document to analyze';
        hasError = true;
      } else if (valA.length < 200) {
        if (docAError) docAError.textContent = 'Document seems too short. Please paste the full text.';
        hasError = true;
      } else if (valA.length > 60000) {
        if (docAError) docAError.textContent = 'Document too large. Paste the key sections only.';
        hasError = true;
      } else {
        if (docAError) docAError.textContent = '';
      }

      // Validate Document B in compare mode
      let valB = '';
      if (currentMode === 'compare') {
        valB = (docBInput ? docBInput.value : '').trim();
        if (!valB) {
          if (docBError) docBError.textContent = 'Please paste a document to analyze';
          hasError = true;
        } else if (valB.length < 200) {
          if (docBError) docBError.textContent = 'Document seems too short. Please paste the full text.';
          hasError = true;
        } else if (valB.length > 60000) {
          if (docBError) docBError.textContent = 'Document too large. Paste the key sections only.';
          hasError = true;
        } else {
          if (docBError) docBError.textContent = '';
        }
      }

      if (hasError) return;

      // Save sanitized values to safeStorage
      safeStorage.setItem('lgDocA', sanitizeDoc(valA));
      if (currentMode === 'compare') {
        safeStorage.setItem('lgDocB', sanitizeDoc(valB));
      } else {
        safeStorage.removeItem('lgDocB');
      }
      safeStorage.setItem('lgMode', currentMode);

      // Transition to loading & run classification
      showScreen('screen-loading');
      runClassification();
    }

    // ==========================================================================
    // SCREEN 3 & GEMINI CALL 1: Classification API Logic
    // ==========================================================================
    /** Classifies the document type and complexity via Gemini Call 1. */
    async function runClassification() {
      if (!appReady) {
        showErrorBanner('Server not reachable. Please refresh.');
        return;
      }
      assertOnline();
      startLoadingCycle();
      try {
        const docA = sanitizeDoc(safeStorage.getItem('lgDocA') || '');
        const isComparison = safeStorage.getItem('lgMode') === 'compare';
        const docB = isComparison ? sanitizeDoc(safeStorage.getItem('lgDocB') || '') : '';

        const docText = isComparison
          ? `DOCUMENT A:\n${docA}\n\nDOCUMENT B:\n${docB}`
          : docA;

        const classificationPrompt = `Classify this legal document. Return JSON matching this schema exactly:
{
  "doc_type": string,         // e.g. "Employment Contract", "NDA", "Lease Agreement"
  "complexity": "low" | "medium" | "high",
  "is_comparison": boolean,   // true if user submitted two documents
  "primary_concern": "risk" | "obligations" | "rights" | "comparison" | "ambiguity",
  "secondary_concern": "risk" | "obligations" | "rights" | "comparison" | "ambiguity" | null,
  "consult_lawyer": boolean,  // true if doc is too ambiguous or incomplete to analyze
  "consult_reason": string | null
}

RULES:
- Only classify based on what is present in the document.
- If document is too short, unclear, or not a legal document, set consult_lawyer: true.
- Never guess beyond what the text contains.

DOCUMENT:
${docText}`;

        const requestBody = {
          model: 'gemini-3.1-flash-lite',
          system_instruction: {
            parts: [{
              text: `You are a legal document classifier. \nRespond ONLY in valid JSON. No markdown. No explanation.`
            }]
          },
          contents: [{
            role: "user",
            parts: [{ text: classificationPrompt }]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            temperature: 0.1,
            maxOutputTokens: 300
          }
        };

        let response;
        try {
          response = await fetch('/api/gemini', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody)
          });
        } catch (networkErr) {
          throw new Error('NETWORK_ERROR');
        }

        if (!response.ok) {
          throw new Error(`STATUS_${response.status}`);
        }

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) {
          throw new Error('JSON_PARSE_FAIL');
        }

        let classification;
        try {
          classification = JSON.parse(rawText);
        } catch (jsonErr) {
          throw new Error('JSON_PARSE_FAIL');
        }

        safeStorage.setItem('lgClassification', JSON.stringify(classification));

        if (classification.consult_lawyer === true) {
          stopLoadingCycle();
          renderConsultCard(classification.consult_reason || "This document requires human legal review.");
        } else {
          runAnalysis(classification);
        }

      } catch (e) {
        stopLoadingCycle();
        if (e.message === 'offline') return;

        if (e.message === 'JSON_PARSE_FAIL') {
          renderConsultCard("Document could not be processed. Please consult a lawyer.");
          return;
        }

        let statusCode = 500;
        const match = e.message.match(/STATUS_(\d+)/);
        if (match) statusCode = parseInt(match[1], 10);

        const errorMsg = (e.message === 'NETWORK_ERROR' || e.message.includes('network') || e.message.includes('Failed to fetch'))
          ? 'No internet connection. Please check your network.'
          : geminiErrorMessage(statusCode);

        showScreen('screen-input');
        showErrorBanner(errorMsg);
      }
    }

    // ==========================================================================
    // Analysis Schemas & Selection Logic
    // ==========================================================================
    const SCHEMA_RISK = `{
  "doc_summary": "string — 2 sentences max",
  "overall_score": number (0-100, 100 = highest risk),
  "risk_categories": [
    {
      "name": "string",
      "score": number (0-100),
      "note": "string — one line",
      "source_clause": "string — clause/section label from document",
      "source_text": "string — exact sentence from document"
    }
  ],
  "red_flags": [
    {
      "title": "string",
      "severity": "low" | "medium" | "high",
      "plain_english": "string",
      "source_clause": "string",
      "source_text": "string"
    }
  ],
  "consult_lawyer": boolean,
  "consult_reason": "string | null"
}`;

    const SCHEMA_TIMELINE = `{
  "doc_summary": "string — 2 sentences max",
  "obligations": [
    {
      "title": "string",
      "deadline": "string",
      "severity": "low" | "medium" | "high",
      "plain_english": "string",
      "source_clause": "string",
      "source_text": "string"
    }
  ],
  "risk_categories": [
    {
      "name": "string",
      "score": number (0-100),
      "note": "string",
      "source_clause": "string",
      "source_text": "string"
    }
  ],
  "overall_score": number (0-100),
  "consult_lawyer": boolean,
  "consult_reason": "string | null"
}`;

    const SCHEMA_CLAUSES = `{
  "doc_summary": "string — 2 sentences max",
  "clauses": [
    {
      "title": "string",
      "type": "obligation" | "right" | "risk" | "penalty" | "termination",
      "flag": boolean,
      "plain_english": "string",
      "source_clause": "string",
      "source_text": "string"
    }
  ],
  "overall_score": number (0-100),
  "consult_lawyer": boolean,
  "consult_reason": "string | null"
}`;

    const SCHEMA_BATTLE = `{
  "doc_summary": "string — 2 sentences comparing both documents",
  "comparisons": [
    {
      "aspect": "string",
      "doc_a": "string",
      "doc_b": "string",
      "doc_a_source": "string — clause label from Doc A",
      "doc_b_source": "string — clause label from Doc B",
      "winner": "A" | "B" | "tie",
      "reason": "string — why this winner is better for the user"
    }
  ],
  "overall_score_a": number (0-100, risk score),
  "overall_score_b": number (0-100, risk score),
  "consult_lawyer": boolean,
  "consult_reason": "string | null"
}`;

    /** Selects exactly 2 visuals based on document classification. */
    function selectVisuals(classification) {
      const { primary_concern, is_comparison } = classification;

      if (is_comparison) return ['battle', 'risk'];

      const map = {
        'obligations' : ['timeline', 'risk'],
        'risk'        : ['risk', 'clauses'],
        'rights'      : ['clauses', 'risk'],
        'ambiguity'   : ['clauses', 'lawyer'],
        'comparison'  : ['battle', 'risk'],
      };

      return map[primary_concern] || ['risk', 'clauses'];
    }

    function selectSchema(classification) {
      if (classification.is_comparison) return SCHEMA_BATTLE;
      const concern = classification.primary_concern;
      if (concern === 'obligations') return SCHEMA_TIMELINE;
      if (concern === 'risk')        return SCHEMA_RISK;
      if (concern === 'rights')      return SCHEMA_CLAUSES;
      if (concern === 'ambiguity')   return SCHEMA_CLAUSES;
      return SCHEMA_RISK; // safe default
    }

    // ==========================================================================
    // SCREEN 4 & GEMINI CALL 2: Deep Analysis API Logic
    // ==========================================================================
    /** Runs deep legal analysis via Gemini Call 2 based on classification. */
    async function runAnalysis(classification) {
      if (!appReady) {
        showErrorBanner('Server not reachable. Please refresh.');
        return;
      }
      assertOnline();
      const analysisStart = Date.now();
      try {
        // Frontend Decides Visuals
        const visuals = selectVisuals(classification);
        safeStorage.setItem('lgVisuals', JSON.stringify(visuals));

        // Schema Selection
        const selectedSchema = selectSchema(classification);

        const docType = classification.doc_type || 'Legal Document';
        const docA = sanitizeDoc(safeStorage.getItem('lgDocA') || '');
        const isComparison = classification.is_comparison || (safeStorage.getItem('lgMode') === 'compare');
        const docB = isComparison ? sanitizeDoc(safeStorage.getItem('lgDocB') || '') : '';

        const docBSection = (isComparison && docB) ? `DOCUMENT B:\n${docB}` : '';

        const analysisPrompt = `Analyze this legal document. Document type: ${docType}.
Return JSON matching this schema EXACTLY:
${selectedSchema}

RULES:
- source_text must be copied verbatim from the document below.
- If a field has no evidence in the document, omit the item.
- overall_score: 0 = no risk, 100 = extreme risk.

DOCUMENT A:
${docA}

${docBSection}`;

        const requestBody = {
          model: 'gemini-3.1-flash-lite',
          system_instruction: {
            parts: [{
              text: `You are a legal document analyst. Respond ONLY in valid JSON.\nNo markdown. No explanation. No preamble.\nSTRICT RULES:\n- Every insight must include source_clause and source_text copied\n  verbatim from the document.\n- If you cannot find a direct source for a claim, omit that item\n  entirely and set consult_lawyer: true.\n- Never fabricate clause references.\n- Never give professional legal advice.\n- Be concise. No item should exceed 2 sentences.`
            }]
          },
          contents: [{
            role: "user",
            parts: [{ text: analysisPrompt }]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            temperature: 0.1,
            maxOutputTokens: 1200
          }
        };

        let response;
        try {
          response = await fetch('/api/gemini', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody)
          });
        } catch (networkErr) {
          throw new Error('NETWORK_ERROR');
        }

        if (!response.ok) {
          throw new Error(`STATUS_${response.status}`);
        }

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) {
          throw new Error('JSON_PARSE_FAIL');
        }

        let analysis;
        try {
          analysis = JSON.parse(rawText);
        } catch (jsonErr) {
          throw new Error('JSON_PARSE_FAIL');
        }

        safeStorage.setItem('lgAnalysis', JSON.stringify(analysis));

        // Record analysis metadata
        window._lg?.recordAnalysis(
          classification,
          JSON.parse(safeStorage.getItem('lgVisuals') || sessionStorage.getItem('lgVisuals') || '[]'),
          analysis.consult_lawyer || false,
          Date.now() - analysisStart
        );

        if (analysis.consult_lawyer === true) {
          stopLoadingCycle();
          renderConsultCard(analysis.consult_reason || "This document requires human legal review.");
        } else {
          stopLoadingCycle();
          renderResults(analysis, classification);
        }

      } catch (e) {
        stopLoadingCycle();
        if (e.message === 'offline') return;

        if (e.message === 'JSON_PARSE_FAIL') {
          renderConsultCard("Analysis could not be completed. A lawyer's review is recommended.");
          return;
        }

        let statusCode = 500;
        const match = e.message.match(/STATUS_(\d+)/);
        if (match) statusCode = parseInt(match[1], 10);

        const errorMsg = (e.message === 'NETWORK_ERROR' || e.message.includes('network') || e.message.includes('Failed to fetch'))
          ? 'No internet connection. Please check your network.'
          : geminiErrorMessage(statusCode);

        showScreen('screen-input');
        showErrorBanner(errorMsg);
      }
    }

    // ==========================================================================
    // Results Screen Renderers & Visuals
    // ==========================================================================

    // SVG Score Arc Builder with Instrument Serif Tabular Numerals
    function buildArc(score) {
      const color = score >= 70 ? 'var(--accent-red)'
                  : score >= 40 ? 'var(--accent-amber)'
                  : 'var(--accent-green)';
      const pct = Math.min(Math.max(score, 0), 100) / 100;
      const r = 54, cx = 64, cy = 64;
      const circ = 2 * Math.PI * r;
      const dash = pct * circ * 0.75; // 270deg arc
      return `
        <svg width="128" height="128" viewBox="0 0 128 128"
             role="img" aria-label="Risk score ${score} out of 100">
          <circle cx="${cx}" cy="${cy}" r="${r}"
            fill="none" stroke="var(--bg-elevated)"
            stroke-width="8"
            stroke-dasharray="${circ * 0.75} ${circ}"
            stroke-dashoffset="0"
            transform="rotate(135 ${cx} ${cy})"/>
          <circle cx="${cx}" cy="${cy}" r="${r}"
            fill="none" stroke="${color}"
            stroke-width="8" stroke-linecap="round"
            stroke-dasharray="${dash} ${circ}"
            stroke-dashoffset="0"
            transform="rotate(135 ${cx} ${cy})"/>
          <text x="${cx}" y="${cy}" text-anchor="middle"
            dominant-baseline="central"
            fill="${color}" font-size="28"
            class="risk-score-number"
            font-family="var(--font-display)">${score}</text>
        </svg>`;
    }

    /** Renders the risk meter SVG arc and category breakdown. */
    function renderRiskMeter(analysis, targetSlot) {
      const slot = targetSlot || getNextVisualSlot();
      if (!slot) return;

      const overallScore = typeof analysis.overall_score === 'number' ? analysis.overall_score : 50;
      const scoreColor = overallScore >= 70 ? 'var(--accent-red)'
                       : overallScore >= 40 ? 'var(--accent-amber)'
                       : 'var(--accent-green)';
      const levelLabel = overallScore >= 70 ? 'HIGH RISK'
                       : overallScore >= 40 ? 'MODERATE RISK'
                       : 'LOW RISK';

      const categories = analysis.risk_categories || [];
      let categoriesHtml = '';

      if (categories.length > 0) {
        categoriesHtml = `
          <div class="risk-breakdown-heading">Category Breakdown</div>
          <div class="risk-categories-list">
            ${categories.map(cat => {
              const score = typeof cat.score === 'number' ? cat.score : 0;
              const catColor = score >= 70 ? 'var(--accent-red)'
                             : score >= 40 ? 'var(--accent-amber)'
                             : 'var(--accent-green)';
              const sourceHtml = (cat.source_clause || cat.source_text) ? `
                <details class="source-detail">
                  <summary>
                    <span class="material-symbols-outlined" aria-hidden="true">pin_drop</span>
                    ${safe(cat.source_clause || 'Section reference')}
                  </summary>
                  <blockquote>${safe(cat.source_text || '')}</blockquote>
                </details>
              ` : '';

              return `
                <div class="risk-category-row">
                  <div class="risk-category-meta">
                    <span class="risk-category-name">${safe(cat.name)}</span>
                    <span class="risk-category-score" style="color: ${catColor};">${score}</span>
                  </div>
                  <div class="risk-progress-track">
                    <div class="risk-progress-bar" style="width: ${Math.min(Math.max(score, 0), 100)}%; background-color: ${catColor};"></div>
                  </div>
                  ${cat.note ? `<div class="risk-category-note">${safe(cat.note)}</div>` : ''}
                  ${sourceHtml}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      slot.innerHTML = `
        <div class="visual-card reveal">
          <div class="visual-card-header">
            <span class="material-symbols-outlined" style="color: var(--accent-blue);" aria-hidden="true">shield</span>
            <h2 class="visual-card-title">Risk Assessment</h2>
          </div>
          <div class="risk-meter-content">
            <div class="risk-arc-wrapper">
              ${buildArc(overallScore)}
              <div class="risk-level-label" style="color: ${scoreColor};">${levelLabel}</div>
            </div>
            ${categoriesHtml}
          </div>
        </div>
      `;
    }

    // VISUAL 2: Clause Map
    const clauseConfig = {
      obligation : { color: 'var(--accent-amber)', icon: 'assignment'   },
      right      : { color: 'var(--accent-green)', icon: 'verified'     },
      risk       : { color: 'var(--accent-red)',   icon: 'warning'      },
      penalty    : { color: 'var(--accent-red)',   icon: 'gavel'        },
      termination: { color: 'var(--text-secondary)',icon: 'cancel'      },

    /** Renders interactive clause map with type-coded cards. */
    function renderClauseMap(analysis, targetSlot) {
      const slot = targetSlot || getNextVisualSlot();

      const emptyHtml = guardEmpty(analysis, 'clauses', 'clause');
      let clausesHtml = '';

      if (emptyHtml) {
        clausesHtml = emptyHtml;
      } else {
        const clauses = analysis.clauses || [];
        clausesHtml = `
          <div class="clause-map-list">
            ${clauses.map(clause => {
              const typeKey = (clause.type || 'obligation').toLowerCase();
              const config = clauseConfig[typeKey] || clauseConfig.obligation;

                      <span>${safe(clause.title)}</span>
                      ${clause.flag ? '<span title="Flagged clause" aria-label="Flagged clause">⚠️</span>' : ''}
                    </div>
                    <span class="clause-badge" style="color: ${config.color}; background-color: rgba(255,255,255,0.05); border: 1px solid ${config.color};">
                      ${safe(clause.type || 'Clause')}

                  </div>
                  <div class="clause-body-text">${safe(clause.plain_english)}</div>
                  ${sourceHtml}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      slot.innerHTML = `
        <div class="visual-card reveal">
          <div class="visual-card-header">
            <span class="material-symbols-outlined" style="color: var(--accent-blue);" aria-hidden="true">map</span>
            <h2 class="visual-card-title">Clause Map</h2>

    // Red Flags Strip

        container.innerHTML = '';
        container.hidden = true;
        return;

      container.hidden = false;
      container.innerHTML = `
        <div class="red-flags-card reveal">
          <div class="red-flags-header">
            <h2 class="red-flags-title" style="color: var(--accent-red);">

              <span>Key Red Flags</span>
            </h2>
          </div>

            ${flags.map(flag => {

              const sevAria = sev === 'high' ? 'Severity: High' : sev === 'low' ? 'Severity: Low' : 'Severity: Medium';

              return `
                <div class="red-flag-item">

    // Main Results Renderer
    function renderResults(analysis, classification) {
      stopLoadingCycle();

      // 1. Populate results header
      const docTypeBadge = document.getElementById('badge-doc-type');
      const complexityBadge = document.getElementById('badge-complexity');
      if (docTypeBadge) {
        docTypeBadge.textContent = classification?.doc_type || 'Legal Document';
      }
      if (complexityBadge) {
        const comp = (classification?.complexity || 'medium').toLowerCase();
        complexityBadge.textContent = `${comp} complexity`;
        complexityBadge.className = `badge-complexity ${comp}`;
      }

      // 2. Populate summary strip
      const summaryText = document.getElementById('results-summary-text');
      if (summaryText) {
        summaryText.textContent = analysis?.doc_summary || 'Document analysis completed.';
      }

      // 3. Get visuals from safeStorage lgVisuals
      let visuals = ['risk', 'clauses'];
      try {
        const stored = safeStorage.getItem('lgVisuals');
        if (stored) visuals = JSON.parse(stored);
      } catch(e) {}
      const [v1, v2] = visuals;

      // 4. Render each visual into its slot
      const slot1 = document.getElementById('visual-slot-1');
      const slot2 = document.getElementById('visual-slot-2');
      if (slot1) slot1.innerHTML = '';
      if (slot2) slot2.innerHTML = '';

      const renderers = {
        'risk'    : (slot) => renderRiskMeter(analysis, slot),
        'clauses' : (slot) => renderClauseMap(analysis, slot),
        'timeline': (slot) => renderTimeline(analysis, slot),
        'battle'  : (slot) => renderBattle(analysis, slot),
        'lawyer'  : (slot) => renderLawyerPrep(analysis, slot),
      };

      if (renderers[v1]) renderers[v1](slot1);
      if (renderers[v2]) renderers[v2](slot2);

      // 5. Render red flags strip if analysis.red_flags exists
      renderRedFlags(analysis?.red_flags || []);

      // 6. Render lawyer prep CTA (always)
      renderLawyerCTA();

      // Hook up Analyze New Document button
      const btnNewDoc = document.getElementById('btn-new-doc');

    const CONSULT_DEFAULTS = {
      too_ambiguous:
        "This document contains language that can be interpreted in more than one way. A qualified lawyer should clarify its meaning before you sign or act on it.",
      incomplete:
        "This document appears incomplete or uses highly jurisdiction-specific terms. A lawyer familiar with your region's laws should review it.",
      not_legal:
        "This doesn't appear to be a standard legal document. If you believe it is, try pasting a larger section — or bring it directly to a legal professional.",
      parse_fail:
        "We weren't able to fully process this document. This can happen with unusual formatting or very complex language. A lawyer's review is recommended.",
      default:
        "This document requires professional legal review. We've identified elements that go beyond what an automated tool can reliably analyze."
    };

    function getConsultMessage(reason) {
      if (!reason || typeof reason !== 'string') return CONSULT_DEFAULTS.default;
      const lower = reason.toLowerCase();
      if (lower.includes('ambigu')) return CONSULT_DEFAULTS.too_ambiguous;
      if (lower.includes('incomplete') || lower.includes('jurisdiction') || lower.includes('short')) return CONSULT_DEFAULTS.incomplete;
      if (lower.includes('not legal') || lower.includes('not a legal') || lower.includes('non-legal')) return CONSULT_DEFAULTS.not_legal;
      if (lower.includes('parse') || lower.includes('format') || lower.includes('process') || lower.includes('could not')) return CONSULT_DEFAULTS.parse_fail;
      if (reason.length > 10 && !reason.includes('Error') && !reason.includes('STATUS_') && !reason.includes('{')) {
        return reason;
      }
      return CONSULT_DEFAULTS.default;
    }

          const isPassword = keyInput.type === 'password';
          keyInput.type = isPassword ? 'text' : 'password';
          btnKeyToggle.setAttribute('aria-label', isPassword ? 'Hide API key' : 'Show API key');
          const icon = btnKeyToggle.querySelector('.material-symbols-outlined');
          if (icon) icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }

      // Save key
      if (btnKeySave && keyInput) {
        btnKeySave.addEventListener('click', () => {
          const key = keyInput.value.trim();
          if (keyError) keyError.hidden = true;
          if (keySavedMsg) keySavedMsg.hidden = true;

          if (!key) {
            if (keyError) {
              keyError.textContent = 'Please enter your API key.';
              keyError.hidden = false;
            }
            return;
          }
          if (key.length < 20) {
            if (keyError) {
              keyError.textContent = 'This does not look like a valid API key.';
              keyError.hidden = false;
            }
            return;
          }

          // Save to sessionStorage
          sessionStorage.setItem('lgKey', key);

          // Update UI state
          if (statusDot) statusDot.className = 'status-dot status-dot--saved';
          if (btnSettings) btnSettings.classList.add('has-key');
          if (keySavedMsg) keySavedMsg.hidden = false;

          // Close panel after short delay
          setTimeout(() => closeSettingsPanel(), 900);
        });
      }

      // Clear error on keydown
      if (keyInput) {
        keyInput.addEventListener('keydown', () => {
          if (keyError) keyError.hidden = true;
        });

        // Save on Enter
        keyInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && btnKeySave) btnKeySave.click();
        });
      }

      // Init on load
      initKeyState();
    });
  </script>

  <!-- Firebase Integration Module -->
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getDatabase, ref, push, set }
      from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
    import { getAnalytics, logEvent }
      from "https://www.gstatic.com/firebasejs/11.0.0/firebase-analytics.js";

    let db        = null;
    let analytics = null;

    // ── Session ID — anonymous UUID, one per page load ───
    const SESSION_ID = crypto.randomUUID
      ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });

    /**
     * Called by initApp() with config fetched from server.
     * Config arrives at runtime — never hardcoded in HTML.
     */
    window.initFirebase = async function(config) {
      try {
        const firebaseApp = initializeApp(config);
        db        = getDatabase(firebaseApp);
        analytics = getAnalytics(firebaseApp);
      } catch (e) {
        console.error('Firebase init error:', e.message);
        // Non-fatal — app still works without analytics
      }
    };

    // ── Analytics helpers — all silent, never block app ──
    window._lg = {

      /** Records anonymous session start */
      recordSession() {
        if (!db) return;
        try {
          set(ref(db, `sessions/${SESSION_ID}`), {
            timestamp: new Date().toISOString(),
            platform : 'web',
          });
          if (analytics) logEvent(analytics, 'session_start');
        } catch { /* silent */ }
      },

      /**
       * Records analysis metadata — no document content ever
       * @param {object} classification — from Gemini Call 1
       * @param {string[]} visuals      — two visual keys shown
       * @param {boolean} consultLawyer — lawyer referral flag
       * @param {number} durationMs     — analysis duration
       */
      recordAnalysis(classification, visuals, consultLawyer, durationMs) {
        if (!db) return;
        try {
          push(ref(db, 'analyses'), {
            session_id          : SESSION_ID,
            timestamp           : new Date().toISOString(),
            doc_type            : classification.doc_type       || 'unknown',
            complexity          : classification.complexity      || 'unknown',
            is_comparison       : classification.is_comparison   || false,
            primary_concern     : classification.primary_concern || 'unknown',
            visuals_shown       : visuals                        || [],
            consult_lawyer      : consultLawyer                  || false,
            analysis_duration_ms: durationMs                    || 0,
          });
          if (analytics) logEvent(analytics, 'analysis_run', {
            doc_type  : classification.doc_type,
            complexity: classification.complexity,
          });
        } catch { /* silent */ }
      },

      /**
       * Records key engagement events
       * @param {string} eventName — one of the approved event names
       */
      recordEvent(eventName) {
        const allowed = [
          'lawyer_prep_generated',
          'source_expanded',
          'new_analysis',
          'compare_mode_used',
          'consult_card_shown',
        ];
        if (!db || !allowed.includes(eventName)) return;
        try {
          push(ref(db, 'events'), {
            session_id: SESSION_ID,
            timestamp : new Date().toISOString(),
            event     : eventName,
          });
          if (analytics) logEvent(analytics, eventName);
        } catch { /* silent */ }
      },

    };
  </script>
